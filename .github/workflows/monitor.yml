name: Monitor

# Cada 15 minutos, desfasado del inicio de la hora (GitHub retrasa más las corridas en :00).
# GitHub puede retrasar o saltarse corridas; la interfaz muestra "último check hace X minutos".
# En repos públicos, los schedules se desactivan tras 60 días sin actividad: ver docs/proyecto/01-despliegue.md.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Llamar a /api/monitor/run
        env:
          APP_URL: ${{ vars.APP_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          test -n "$APP_URL" || { echo "Falta la variable APP_URL"; exit 1; }
          test -n "$MONITOR_SECRET" || { echo "Falta el secreto MONITOR_SECRET"; exit 1; }
          # 300 s es el máximo de una función en Vercel Hobby.
          curl --fail-with-body --silent --show-error --max-time 300 \
            --request POST \
            --header "Authorization: Bearer $MONITOR_SECRET" \
            "$APP_URL/api/monitor/run"
