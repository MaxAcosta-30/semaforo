# Base de datos solo para desarrollo y pruebas locales.
# La contraseña es local y no protege nada real; producción usa Supabase.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: semaforo
      POSTGRES_PASSWORD: semaforo
      POSTGRES_DB: semaforo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semaforo -d semaforo"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
